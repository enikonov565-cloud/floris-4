<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина — Флорис</title>
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<div id="site-header-mount"></div>

<section class="page cart" id="корзина">
  <h1 class="cart-heading"><span class="cap">К</span>орзина</h1>

  <div class="cart-list">
    <div class="cart-row">
      <img class="cart-row-photo" src="frames/корзина/photo1.png" alt="Пробуждение Весны">
      <div class="cart-row-content">
        <p class="cart-row-name"><span class="cap">П</span>робуждение Весны</p>
        <div class="cart-row-meta">
          <p class="cart-row-price">5 200 руб.</p>
          <div class="cart-row-qty"><button aria-label="меньше">-</button><span>1</span><button aria-label="больше">+</button></div>
          <p class="cart-row-total">5 200 руб.</p>
        </div>
      </div>
    </div>
    <div class="cart-row">
      <img class="cart-row-photo" src="frames/корзина/photo2.png" alt="Изысканная Роскошь">
      <div class="cart-row-content">
        <p class="cart-row-name"><span class="cap">И</span>зысканная Роскошь</p>
        <div class="cart-row-meta">
          <p class="cart-row-price">5 300 руб.</p>
          <div class="cart-row-qty"><button aria-label="меньше">-</button><span>1</span><button aria-label="больше">+</button></div>
          <p class="cart-row-total">5 300 руб.</p>
        </div>
      </div>
    </div>
    <div class="cart-row">
      <img class="cart-row-photo" src="frames/корзина/photo3.png" alt="Розовая Симфония">
      <div class="cart-row-content">
        <p class="cart-row-name"><span class="cap">Р</span>озовая Симфония</p>
        <div class="cart-row-meta">
          <p class="cart-row-price">5 800 руб.</p>
          <div class="cart-row-qty"><button aria-label="меньше">-</button><span>1</span><button aria-label="больше">+</button></div>
          <p class="cart-row-total">5 800 руб.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-summary">
    <div class="cart-summary-body">
      <div class="cart-summary-top">
        <p>Ваш заказ:</p>
        <div class="cart-summary-rows">
          <div class="cart-summary-row"><span>Товары: (3)</span><span class="value">16 300 руб.</span></div>
          <div class="cart-summary-row"><span>Доставка:</span><span class="value">Бесплатно</span></div>
        </div>
      </div>
      <div class="cart-summary-total"><span>Итого:</span><span class="price">16 300 руб.</span></div>
    </div>
    <div class="cart-summary-actions">
      <a class="cart-checkout-btn" href="заказ.html">Перейти к оформлению</a>
      <a class="cart-continue-btn" href="категории.html">Продолжить покупки</a>
    </div>
  </div>

  <div class="cart-services">
    <p class="cart-services-label">Дополнительные услуги:</p>
    <div class="cart-services-cols">
      <div class="cart-service"><input type="radio" name="packaging" id="pk1" checked><label for="pk1">Упаковочные материалы</label></div>
      <div class="cart-service"><input type="radio" name="packaging" id="pk4"><label for="pk4">Ленты и банты</label></div>
      <div class="cart-service"><input type="radio" name="packaging" id="pk5"><label for="pk5">Готовые ёмкости и короба</label></div>
      <div class="cart-service"><input type="radio" name="packaging" id="pk11"><label for="pk11">Брендирование и персонализация</label></div>
    </div>
  </div>
</section>

<div id="site-footer-mount"></div>
<script src="components.js"></script>

<script>
(function(){
  var badge = document.querySelector('.topbar-badge');
  var cartCount = parseInt(badge ? badge.textContent : '0', 10) || 0;

  function setBadge(n){
    cartCount = Math.max(0, n);
    if (badge) badge.textContent = String(cartCount);
  }

  function parsePrice(text){
    return parseInt(text.replace(/[^\d]/g, ''), 10) || 0;
  }
  function formatPrice(num){
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' руб.';
  }

  // --- счётчики в карточках каталога: "+"/"-" сразу меняют корзину ---
  document.querySelectorAll('.listing-stepper').forEach(function(stepper){
    var buttons = stepper.querySelectorAll('button');
    var count = stepper.querySelector('span');
    if (buttons.length < 2 || !count) return;
    buttons[0].addEventListener('click', function(){
      var v = parseInt(count.textContent, 10) || 0;
      if (v > 0) {
        count.textContent = String(v - 1);
        setBadge(cartCount - 1);
      }
    });
    buttons[1].addEventListener('click', function(){
      var v = parseInt(count.textContent, 10) || 0;
      count.textContent = String(v + 1);
      setBadge(cartCount + 1);
    });
  });

  // --- счётчик в карточке товара: локальный, влияет на «Добавить в корзину» ---
  document.querySelectorAll('.product-qty').forEach(function(stepper){
    var buttons = stepper.querySelectorAll('button');
    var count = stepper.querySelector('span');
    if (buttons.length < 2 || !count) return;
    buttons[0].addEventListener('click', function(){
      var v = parseInt(count.textContent, 10) || 0;
      count.textContent = String(Math.max(0, v - 1));
    });
    buttons[1].addEventListener('click', function(){
      var v = parseInt(count.textContent, 10) || 0;
      count.textContent = String(v + 1);
    });
  });

  // --- счётчики количества в корзине: пересчитывают сумму строки и итог ---
  function recalcCartSummary(){
    var rows = document.querySelectorAll('.cart-row');
    var totalSum = 0, totalQty = 0;
    rows.forEach(function(row){
      var unit = parsePrice(row.querySelector('.cart-row-price').textContent);
      var qty = parseInt(row.querySelector('.cart-row-qty span').textContent, 10) || 0;
      var lineTotal = unit * qty;
      row.querySelector('.cart-row-total').textContent = formatPrice(lineTotal);
      totalSum += lineTotal;
      totalQty += qty;
    });
    var summaryRow = document.querySelector('.cart-summary-row .value');
    var summaryLabel = document.querySelector('.cart-summary-row span:first-child');
    var summaryTotal = document.querySelector('.cart-summary-total .price');
    if (summaryLabel) summaryLabel.textContent = 'Товары: (' + totalQty + ')';
    if (summaryRow) summaryRow.textContent = formatPrice(totalSum);
    if (summaryTotal) summaryTotal.textContent = formatPrice(totalSum);
  }

  document.querySelectorAll('.cart-row-qty').forEach(function(stepper){
    var buttons = stepper.querySelectorAll('button');
    var count = stepper.querySelector('span');
    if (buttons.length < 2 || !count) return;
    buttons[0].addEventListener('click', function(){
      var v = parseInt(count.textContent, 10) || 1;
      count.textContent = String(Math.max(1, v - 1));
      recalcCartSummary();
    });
    buttons[1].addEventListener('click', function(){
      var v = parseInt(count.textContent, 10) || 1;
      count.textContent = String(v + 1);
      recalcCartSummary();
    });
  });

  document.querySelectorAll('.cart-row-remove').forEach(function(btn){
    btn.addEventListener('click', function(){
      var row = btn.closest('.cart-row');
      if (row) row.remove();
      recalcCartSummary();
    });
  });

  // --- «в корзину» / «Добавить в корзину»: увеличивают счётчик в хедере ---
  document.querySelectorAll('.postcard-btn').forEach(function(btn){
    btn.style.cursor = 'pointer';
    btn.addEventListener('click', function(){
      setBadge(cartCount + 1);
    });
  });

  var addBtn = document.querySelector('.product-add-btn');
  if (addBtn) {
    addBtn.addEventListener('click', function(){
      var qtyEl = document.querySelector('.product-qty span');
      var qty = qtyEl ? (parseInt(qtyEl.textContent, 10) || 1) : 1;
      setBadge(cartCount + qty);
    });
  }
})();
</script>

</body>
</html>
