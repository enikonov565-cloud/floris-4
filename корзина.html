<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина — Флорис</title>
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<div id="site-header-mount"></div>

<section class="page cart" id="корзина">
  <h1 class="cart-heading"><span class="cap">К</span>орзина</h1>

  <div class="cart-list" id="cart-list"></div>
  <p id="cart-empty" hidden style="font-family:var(--font-sans);font-size:18px;color:rgba(45,45,53,0.55);padding:20px 0;">Корзина пуста — добавьте букет из каталога.</p>

  <div class="cart-summary">
    <div class="cart-summary-body">
      <div class="cart-summary-top">
        <p>Ваш заказ:</p>
        <div class="cart-summary-rows">
          <div class="cart-summary-row"><span>Товары: (3)</span><span class="value">16 300 руб.</span></div>
          <div class="cart-summary-row"><span>Доставка:</span><span class="value">Бесплатно</span></div>
        </div>
      </div>
      <div class="cart-summary-total"><span>Итого:</span><span class="price">16 300 руб.</span></div>
    </div>
    <div class="cart-summary-actions">
      <a class="cart-checkout-btn" href="заказ.html" data-magnetic>Перейти к оформлению</a>
      <a class="cart-continue-btn" href="категории.html" data-magnetic>Продолжить покупки</a>
    </div>
  </div>

  <div class="cart-services">
    <p class="cart-services-label">Дополнительные услуги:</p>
    <div class="cart-services-cols">
      <div class="cart-service"><input type="radio" name="packaging" id="pk1" checked><label for="pk1">Упаковочные материалы</label></div>
      <div class="cart-service"><input type="radio" name="packaging" id="pk4"><label for="pk4">Ленты и банты</label></div>
      <div class="cart-service"><input type="radio" name="packaging" id="pk5"><label for="pk5">Готовые ёмкости и короба</label></div>
      <div class="cart-service"><input type="radio" name="packaging" id="pk11"><label for="pk11">Брендирование и персонализация</label></div>
    </div>
  </div>
</section>

<div id="site-footer-mount"></div>
<script src="components.js"></script>

<script>
(function(){
  function formatPrice(num){
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' руб.';
  }

  var listEl = document.getElementById('cart-list');
  var emptyEl = document.getElementById('cart-empty');

  function renderRow(item){
    var row = document.createElement('div');
    row.className = 'cart-row';
    row.innerHTML =
      '<img class="cart-row-photo" src="' + item.photo + '" alt="' + item.name + '">' +
      '<div class="cart-row-content">' +
        '<p class="cart-row-name">' + item.name + '</p>' +
        '<div class="cart-row-meta">' +
          '<p class="cart-row-price">' + formatPrice(item.price) + '</p>' +
          '<div class="cart-row-qty"><button type="button" aria-label="меньше">-</button><span>' + item.qty + '</span><button type="button" aria-label="больше">+</button></div>' +
          '<p class="cart-row-total">' + formatPrice(item.price * item.qty) + '</p>' +
        '</div>' +
      '</div>';
    var qtyButtons = row.querySelectorAll('.cart-row-qty button');
    qtyButtons[0].addEventListener('click', function(){
      window.florisCart.setItemQty(item.id, item.qty - 1);
      render();
    });
    qtyButtons[1].addEventListener('click', function(){
      window.florisCart.setItemQty(item.id, item.qty + 1);
      render();
    });
    return row;
  }

  function render(){
    var items = window.florisCart ? window.florisCart.getItems() : [];
    listEl.innerHTML = '';
    var hasItems = items.length > 0;
    listEl.hidden = !hasItems;
    if (emptyEl) emptyEl.hidden = hasItems;
    items.forEach(function(item){ listEl.appendChild(renderRow(item)); });

    var totalSum = 0, totalQty = 0;
    items.forEach(function(it){ totalSum += it.price * it.qty; totalQty += it.qty; });
    var summaryRow = document.querySelector('.cart-summary-row .value');
    var summaryLabel = document.querySelector('.cart-summary-row span:first-child');
    var summaryTotal = document.querySelector('.cart-summary-total .price');
    if (summaryLabel) summaryLabel.textContent = 'Товары: (' + totalQty + ')';
    if (summaryRow) summaryRow.textContent = formatPrice(totalSum);
    if (summaryTotal) summaryTotal.textContent = formatPrice(totalSum);
  }

  render();
})();
</script>

</body>
</html>
